    Organization:
      title: Organization
      description: The Organization entity shall represent a legal entity, such as a farming business,
        a cooperative, a contracting business, an advisory service, a laboratory, a veterinary practice,
        a trading partner, a certification body or a public authority. Within a given deployment it is
        the top-level container for all other data; in a federated environment each participating organization
        maintains its own Organization root.
      type: object
      properties:
        '@context':
          $ref: '#/components/schemas/JsonLdContext'
        '@id':
          $ref: '#/components/schemas/JsonLdId'
        '@type':
          const: Organization
          description: The entity, in a JSON-LD representation.
        id:
          $ref: '#/components/schemas/Uuid'
          description: Unique identifier of the record, its primary key. Generated by the client that
            creates the record, so that records created while offline do not collide (clauses 5.1 a) and
            9).
          x-agfoda-property: https://w3id.org/agrifooddata/term/id
        name:
          type: string
          description: Name of the organization.
          x-agfoda-property: https://w3id.org/agrifooddata/term/name
        legalForm:
          type: string
          description: Legal form of the organization.
          x-agfoda-property: https://w3id.org/agrifooddata/term/legalForm
        vatId:
          type: string
          description: Value added tax identification number.
          x-agfoda-property: https://w3id.org/agrifooddata/term/vatId
        registrationNumbers:
          type: object
          additionalProperties:
            type: string
          description: Official identifiers of the organization, keyed by issuing scheme.
          x-agfoda-property: https://w3id.org/agrifooddata/term/registrationNumbers
        roleUris:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConceptUri'
          description: Roles performed by the organization in the value chain.
          x-agfoda-property: https://w3id.org/agrifooddata/term/roleUris
        addressId:
          $ref: '#/components/schemas/Uuid'
          description: Foreign key to the Address entity.
          x-agfoda-property: https://w3id.org/agrifooddata/term/addressId
          x-agfoda-references: Address
        externalId:
          type: string
          description: Identifier in an external system.
          x-agfoda-property: https://w3id.org/agrifooddata/term/externalId
        externalProvider:
          type: string
          description: Identifier of the external system.
          x-agfoda-property: https://w3id.org/agrifooddata/term/externalProvider
        createdAt:
          $ref: '#/components/schemas/DateTime'
          description: Time at which the record was created, set by the system.
          readOnly: true
          x-agfoda-property: https://w3id.org/agrifooddata/term/createdAt
        updatedAt:
          $ref: '#/components/schemas/DateTime'
          description: Time of the last change to the record, set by the system. The cursor of offline
            synchronization and the basis of per-attribute last-write-wins conflict resolution (clauses
            5.1 b) and 9).
          readOnly: true
          x-agfoda-property: https://w3id.org/agrifooddata/term/updatedAt
        originType:
          $ref: '#/components/schemas/OriginType'
          description: How the record came into being. Set when the record is created and not modified
            afterwards (clause 5.1 l)).
          x-agfoda-property: https://w3id.org/agrifooddata/term/originType
        createdByUserId:
          $ref: '#/components/schemas/Uuid'
          description: User who created the record.
          readOnly: true
          x-agfoda-property: https://w3id.org/agrifooddata/term/createdByUser
          x-agfoda-references: User
        createdByJobId:
          $ref: '#/components/schemas/Uuid'
          description: Processing run that created the record. The service responsible follows transitively
            from ProcessingJob.serviceId (clause 5.1 l)).
          readOnly: true
          x-agfoda-property: https://w3id.org/agrifooddata/term/createdByJob
          x-agfoda-references: ProcessingJob
        clientId:
          type: string
          description: Application or interface client that created the record.
          readOnly: true
          x-agfoda-property: https://w3id.org/agrifooddata/term/clientId
      required:
      - id
      - name
      - createdAt
      - updatedAt
      - originType
      additionalProperties: false
      allOf:
      - $comment: 'V04: createdByUserId is set where originType is USER.'
        if:
          properties:
            originType:
              enum:
              - USER
          required:
          - originType
        then:
          required:
          - createdByUserId
      - $comment: 'V04: createdByJobId is set where originType is SERVICE.'
        if:
          properties:
            originType:
              enum:
              - SERVICE
          required:
          - originType
        then:
          required:
          - createdByJobId
      x-agfoda-class: https://w3id.org/agrifooddata/term/Organization
      x-agfoda-package: P1
      x-agfoda-annex: A.1
