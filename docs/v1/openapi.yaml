    CultivationPeriod:
      title: CultivationPeriod
      description: 'The CultivationPeriod entity shall represent the cultivation of a specific crop, including
        its cultivar, on a specific Region over a defined period of time. The period is not restricted
        to a single growing season: depending on crop type, cultivar, environmental conditions and management
        practice, it may cover part of a season, a full season, or several successive or overlapping cultivation
        cycles. Where cultivation cycles overlap in time on the same region, each cycle shall be represented
        by a separate CultivationPeriod instance. For a perennial planting it represents the annual vegetative
        cycle of a Stand.'
