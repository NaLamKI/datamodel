  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identifier of the record.
      schema:
        $ref: '#/components/schemas/Uuid'
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of records on the page.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: The nextCursor of the previous page.
      schema:
        type: string
    UpdatedAfter:
      name: updatedAfter
      in: query
      required: false
      description: 'Start of a synchronization: records with a later updatedAt.'
      schema:
        $ref: '#/components/schemas/DateTime'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Act only on this version of the record.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: '`*`: create only, never replace.'
      schema:
        type: string
        enum:
        - '*'
    ProcessingJobId:
      name: Processing-Job-Id
      in: header
      required: false
      description: The ProcessingJob a processing run writes in; the server sets createdByJobId (or AuditLog.changedByJobId)
        from it.
      schema:
        $ref: '#/components/schemas/Uuid'
    ChangeReason:
      name: Change-Reason
      in: header
      required: false
      description: Reason for a correction of documentation already reported; recorded as AuditLog.reason.
        Required on that path, otherwise optional.
      schema:
        type: string
        minLength: 1
    FeatureLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 10
    Bbox:
      name: bbox
      in: query
      required: false
      style: form
      explode: false
      description: 'Only features intersecting this bounding box (WGS 84: min longitude, min latitude,
        max longitude, max latitude).'
      schema:
        type: array
        minItems: 4
        maxItems: 4
        items:
          type: number
    Datetime:
      name: datetime
      in: query
      required: false
      description: Only features valid at this instant or within this interval (startsAt, endsAt).
      schema:
        type: string
  headers:
    ETag:
      description: Version of the record, for If-Match.
      schema:
        type: string
    Location:
      description: Address of the record created.
      schema:
        type: string
        format: uri
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Not authenticated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not authorized for this farm and permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: invalid-transition, immutable-record, duplicate-key or dependent-records.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: 'The record has changed since the version named in If-Match, or exists although If-None-Match:
        * was sent.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: invalid-record, rule-violation or reason-required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
