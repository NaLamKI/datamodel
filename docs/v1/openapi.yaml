  /stock-levels:
    get:
      tags:
      - Derived views
      operationId: listStockLevels
      summary: Stock levels, derived from stock movements
      description: The sum of the StockMovement records for a combination of productId, lotId and storage
        location. A movement adds its quantity to the level at toStorageLocationId and subtracts it from
        the level at fromStorageLocationId, per productId, lotId and unit. A movement without a storage
        location on one side does not affect a level on that side. Levels in different units are not added
        up. Stock levels are computed, never stored (clause 7.5).
      parameters:
      - name: productId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: lotId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: storageLocationId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The levels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevels'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-agfoda-permission: stockMovement:read
