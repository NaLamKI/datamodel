openapi: 3.1.0
info:
  title: AgriFoodData API
  version: 1.0.0-draft.3
  summary: Reference REST binding of the AgriFoodData model
  description: |
    Reference REST binding of the **AgriFoodData model** — the data model of the
    Recommendation *Data model for digital agriculture and farm management systems* (draft, revision 3, proposed to ITU-T Study Group 20, 2026-07-29).

    The resources and their attributes are the entities of the model; each
    attribute maps onto a property of the [agrifooddata ontology](https://ontology.agrifooddata.org/).
    The paths, headers and status codes are the binding of this repository — the
    Recommendation specifies the data and the requirements of its clauses 9 and 10,
    not a REST interface.

    **Representations.** JSON as specified in clause 9: camelCase, UTC timestamps,
    GeoJSON geometries, enumerations in upper case, identifiers as strings.
    Optional attributes that are not set are omitted, never `null`. Asked for
    `application/ld+json`, the server adds three JSON-LD keywords in front —
    `@context` (https://datamodel.agrifooddata.org/v1/context.jsonld), `@id` (`urn:uuid:` and the id) and
    `@type` (the entity) — and leaves the attributes as they are.

    **Identifiers** are UUIDs in lower case, generated by the client that creates
    a record, so that records created while offline do not collide.

    **Synchronization.** Every collection lists in the order of `updatedAt`, then
    `id`; a client polls each collection with the cursor of its last page.
    Withdrawals arrive as status changes, deletions as DELETE entries of
    `/audit-logs`. Writes conflict per attribute, and the later write wins
    (clause 5.1 b)); documentation already reported is corrected only with a
    `Change-Reason` (correction path).

    **Provenance** (clause 5.1 l)). The server sets `createdAt`, `updatedAt`,
    `createdByUserId`, `createdByJobId` and `clientId` from the authenticated
    caller. A processing run that writes names its ProcessingJob in the
    `Processing-Job-Id` header; every automatic creation of data is such a run.

    **Security** (clause 10). Every request is authenticated through the external
    identity and access management system (OpenID Connect) and authorized against
    its policies; the roles and access assignments of the model are evaluated in
    addition, never instead. `x-agfoda-permission` names the permission, in the
    `entity:action` pattern of `Role.permissions`, that an operation requires on
    the farm concerned.

    **Problems** are reported as RFC 9457 problem details; their `type` is
    https://datamodel.agrifooddata.org/v1/problems/<type>:

    | Type | Status | Meaning |
    |---|---|---|
    | `invalid-record` | 422 | The record does not conform to its schema |
    | `rule-violation` | 422 | An integrity rule is violated |
    | `invalid-transition` | 409 | The status change is not permitted |
    | `immutable-record` | 409 | The record can no longer be changed |
    | `duplicate-key` | 409 | A business key is already taken |
    | `reason-required` | 422 | A correction needs a reason |
    | `dependent-records` | 409 | Other records depend on this one |

    The geospatial entities Field, Region and Site are also served as feature
    collections conforming to OGC API - Features (`/features`).
  license:
    name: CC BY 4.0
    identifier: CC-BY-4.0
externalDocs:
  description: Reference documentation of the model
  url: https://datamodel.agrifooddata.org/v1/
servers:
- url: https://{host}/v1
  description: A deployment of the AgriFoodData API
  variables:
    host:
      default: fmis.example.org
      description: Host of the deployment
security:
- oidc: []
tags:
- name: P1 Party, Users and Access
  description: This package provides the foundation for multi-tenancy, access to several holdings, role-based
    access control and personnel master data. It distinguishes between the User, a person who interacts
    with the system through an account, and the Worker, a person who performs work on the holding and
    who may have no system account, such as a seasonal worker or the driver of a contractor.
- name: P2 Farm and Sites
  description: This package contains the central Farm entity, which acts as the primary anchor for all
    agricultural operations and for the assignment of access rights, together with the built and technical
    locations of the holding.
- name: P3 Fields and Geospatial Data
  description: This package defines the geospatial structure of the holding and the physical layout of
    the land.
- name: P4 Cropping Planning and Cultivation
  description: This package separates what is intended from what has occurred. CroppingPlan and CroppingPlanEntry
    express the intended assignment of crops to regions for a harvest year; CultivationPeriod records
    the cultivation that actually took place; and Stand represents the multi-year life cycle of a perennial
    planting.
- name: P5 Work and Operations Management
  description: This package models the work carried out on the holding. It covers the ordering of work
    (Task), its documentation (Activity), the resources deployed (ActivityResource) and the working time
    recorded (TimeRecord). Together these entities constitute the electronic field record.
- name: P6 Products and Inventory
  description: This package covers the master data of all inputs and produce and the movements of stock.
    It is the anchor for regulatory information attached to products and for traceability from the field
    to the customer.
- name: P7 Machinery and Equipment
  description: This package covers machines and implements, including their machine-level identity and
    their attachment to telemetry.
- name: P8 Animal Husbandry
  description: 'This package models animal husbandry. Its design is event-oriented: occurrences are recorded
    through a single generic AnimalEvent entity rather than through a separate entity per type of occurrence,
    and the event types are aligned with ICAR ADE. Notifications required by an authority are generated
    from these events as specified in clause 8.11.'
- name: P9 Observations and Data
  description: This package covers structured individual measurements, the devices that produce them,
    and the datasets and files associated with the holding. Weather data, soil sensing, animal sensing
    and machine telemetry are thereby modelled uniformly.
- name: P10 Economics
  description: This package records the quantities consumed and produced and their monetary valuation,
    across crop production and animal husbandry alike.
- name: P11 Compliance and Audit
  description: This package covers formal reporting to authorities and certification bodies, the certification
    status of the holding, and the record of changes. Reports are generated from the operational data,
    which remain the single authoritative source.
- name: P12 Data Processing and Decision Support
  description: 'This package provides a generic execution framework for all data processing services,
    from deterministic transformations, aggregations, validations, ingestion runs and report generation
    through to machine learning inference and analysis supported by language models. The use of artificial
    intelligence is a property of a service, indicated by the aiBased attribute, and not a precondition.
    The package is also the provenance anchor of the model: every automatic creation of data shall be
    executed as a ProcessingJob of a registered ProcessingService.'
- name: P13 Sustainability
  description: This package holds sustainability indicators that are calculated or recorded for a defined
    scope and period, together with the method used and, where applicable, the body that verified them.
    It provides the basis for monitoring, reporting and verification of environmental performance and
    for supplying sustainability information to reporting frameworks.
- name: P14 Semantics and Interoperability
  description: This package links the data model to external vocabularies and code systems. The typeUri
    pattern and the self-description convention of clause 5.1 apply across all packages; this package
    specifies the entity that binds canonical concepts to code systems that are not URI-based.
- name: Derived views
  description: Quantities computed from stored records, not stored as entities (clause 7.5).
- name: Features (OGC API - Features)
  description: Field, Region and Site as GeoJSON feature collections (clause 9).
paths:
  /organizations:
    get:
      tags:
      - P1 Party, Users and Access
      operationId: listOrganizations
      summary: List Organization records
      description: 'Records in synchronization order: by `updatedAt`, then `id` (clause 9). Start with
        `updatedAfter`, continue with the `nextCursor` of the previous page; the last page returns one
        too, so that the next poll resumes where this one ended. A record withdrawn from use appears with
        its terminal status or `endsAt`; a deleted one appears as a DELETE entry of the audit log.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/UpdatedAfter'
      - name: addressId
        in: query
        required: false
        description: Only records whose addressId is this Address.
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: originType
        in: query
        required: false
        description: Only records with this originType.
        schema:
          $ref: '#/components/schemas/OriginType'
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-agfoda-permission: organization:read
  /organizations/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - P1 Party, Users and Access
      operationId: getOrganization
      summary: Read a Organization
      responses:
        '200':
          description: The record; `ETag` identifies its version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-agfoda-permission: organization:read
    put:
      tags:
      - P1 Party, Users and Access
      operationId: putOrganization
      summary: Create or replace a Organization
      description: 'Creates the record under the identifier its client generated (clause 9), or replaces
        it. `If-None-Match: *` creates only; `If-Match` replaces only the version read. The server sets
        `createdAt`, `updatedAt`, `createdByUserId`, `createdByJobId` and `clientId` (clause 5.1 l)).
        `originType` may be declared on creation and is checked against the caller: `USER` for a user,
        `SERVICE`, `DEVICE` or `IMPORT` for a processing run named in `Processing-Job-Id`; it cannot be
        changed afterwards.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IfNoneMatch'
      - $ref: '#/components/parameters/ProcessingJobId'
      - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
          application/ld+json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Organization'
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-agfoda-permission:
      - organization:create
      - organization:update
    patch:
      tags:
      - P1 Party, Users and Access
      operationId: patchOrganization
      summary: Change attributes of a Organization
      description: JSON Merge Patch (RFC 7396). Changes to different attributes do not conflict; of two
        changes to the same attribute the later wins (clause 5.1 b)). A change to documentation that is
        referenced by a RegulatoryReport in status SUBMITTED or later goes through the correction path
        and needs `Change-Reason`, which is recorded in the AuditLog.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ProcessingJobId'
      - $ref: '#/components/parameters/ChangeReason'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/OrganizationPatch'
      responses:
        '200':
          description: Changed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '404':
          $ref: '#/components/responses/NotFound'
      x-agfoda-permission: organization:update
    delete:
      tags:
      - P1 Party, Users and Access
      operationId: deleteOrganization
      summary: Delete a Organization
      description: Operational records are withdrawn from use by a terminal status or `endsAt` rather
        than deleted (clause 5.1 i)). A deletion is recorded as a DELETE entry of the audit log, through
        which synchronizing clients learn of it (clause 9); one that other records depend on is refused.
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/ChangeReason'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      x-agfoda-permission: organization:delete
