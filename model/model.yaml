# The AgriFoodData model — what it is, where it is published, and what every
# entity carries.
#
# The packages under packages/ hold the entities; this file holds what applies
# to all of them (clause 5.1 of the Recommendation) and the addresses the
# generated artefacts are published under. Nothing in docs/ is written by
# hand: tool/build.py generates it from this directory and ontology/.

id: agrifooddata
title: AgriFoodData model
description: >-
  Machine-readable specification of the data model for digital agriculture
  and farm management systems: 47 entities in 14 packages, bound to the
  classes and properties of the agrifooddata ontology.

# Semantic versioning. The major version is part of every published address
# (v1/...), so that an address, once published, keeps meaning the same thing;
# a change that breaks existing records or clients gets a new major version and
# the old one stays where it is. Until the Recommendation is approved the
# version carries its revision as a pre-release label.
version: 1.0.0-draft.3
major: v1

home: https://datamodel.agrifooddata.org/
repository: https://github.com/NaLamKI/datamodel
publisher: NaLamKI
license:
  id: CC-BY-4.0
  url: https://creativecommons.org/licenses/by/4.0/

recommendation:
  title: Data model for digital agriculture and farm management systems
  status: draft, revision 3, proposed to ITU-T Study Group 20
  date: 2026-07-29
  precedence: >-
    In the event of a discrepancy between the Recommendation and this
    machine-readable specification or the ontology, the text of the
    Recommendation takes precedence (clause 8).

ontology:
  title: agrifooddata ontology
  namespace: https://w3id.org/agrifooddata/term/
  prefix: agfoda
  schemes: https://w3id.org/agrifooddata/
  home: https://ontology.agrifooddata.org/
  repository: https://github.com/NaLamKI/ontology

# How a record is identified in RDF. The identifier is a UUID string in JSON
# (clause 9); the JSON-LD context turns every reference into this IRI, so that
# a foreign key and the record it points at meet in the same node.
iri: "urn:uuid:"

# The attributes every entity carries (clause 5.1 a), b), l); Figure A.1).
# Annex A leaves them out of the entity tables; so do the packages here.
entityBase:
  description: >-
    Abstract supertype carrying the attributes common to every entity:
    identifier, system timestamps and provenance.
  attributes:
    id:
      type: UUID
      required: true
      description: Unique identifier of the record, its primary key
      note: >-
        Generated by the client that creates the record, so that records
        created while offline do not collide (clauses 5.1 a) and 9).
    createdAt:
      type: DateTime
      required: true
      readOnly: true
      description: Time at which the record was created, set by the system
    updatedAt:
      type: DateTime
      required: true
      readOnly: true
      description: Time of the last change to the record, set by the system
      note: >-
        The cursor of offline synchronization and the basis of per-attribute
        last-write-wins conflict resolution (clauses 5.1 b) and 9).
    originType:
      type: Enum
      required: true
      immutable: true
      enum: OriginType
      description: How the record came into being
      note: >-
        Set when the record is created and not modified afterwards
        (clause 5.1 l)).
    createdByUserId:
      type: UUID
      readOnly: true
      references: User
      property: createdByUser
      description: User who created the record
    createdByJobId:
      type: UUID
      readOnly: true
      references: ProcessingJob
      property: createdByJob
      description: Processing run that created the record
      note: >-
        The service responsible follows transitively from
        ProcessingJob.serviceId (clause 5.1 l)).
    clientId:
      type: String
      readOnly: true
      description: Application or interface client that created the record
  constraints:
    - requiredWhen:
        attribute: createdByUserId
        when: {originType: [USER]}
      rule: V04
    - requiredWhen:
        attribute: createdByJobId
        when: {originType: [SERVICE]}
      rule: V04

# The model-wide conventions of clause 5.1, as the reference pages state them.
conventions:
  - id: a
    title: Primary key
    text: >-
      Every entity carries an id holding a UUID, which serves as its primary
      key and permits decentralized creation and conflict-free
      synchronization.
  - id: b
    title: System timestamps
    text: >-
      Every entity carries createdAt and updatedAt, set by the system.
      Concurrent modifications are resolved per attribute on a last-write-wins
      basis using updatedAt; a conflict affecting documentation that has
      already been reported is resolved through the correction path, by
      recording the change in the AuditLog together with a reason.
  - id: c
    title: Time
    text: >-
      Timestamps are stored in accordance with ISO 8601-1 in coordinated
      universal time. The time zone used for presentation is given by
      Farm.timezone.
  - id: d
    title: Geometry
    text: >-
      Every geometry attribute holds a GeoJSON geometry object (RFC 7946) in
      WGS 84 and can be served through OGC API - Features.
  - id: e
    title: Semantic type identifiers
    text: >-
      typeUri and every other attribute whose name ends in Uri hold
      dereferenceable URIs of canonical vocabularies, AGROVOC being the
      primary one. Codes of other systems are bound to canonical concepts
      through CodeMapping.
  - id: f
    title: Self-description
    text: >-
      Field, Region, Site, Machine, Device, Data, ProcessingService and Result
      should carry a description holding a W3C WoT Thing Description in
      JSON-LD. The attribute is optional; where present, its content conforms
      to WoT-TD.
  - id: g
    title: External synchronization
    text: >-
      Organization, Farm, Field, Machine, Animal, Product and Device may carry
      externalId and externalProvider to reference records of external
      systems persistently.
  - id: h
    title: Exclusive references
    text: >-
      Where an entity offers alternative references to different parent
      entities, exactly one of them is set.
  - id: i
    title: Retention of operational records
    text: >-
      Operational records are withdrawn from use by a terminal status or an
      endsAt timestamp rather than deleted, and every change is recorded in
      the append-only AuditLog. Personal data in User and Worker are erased or
      pseudonymized where the law requires it, while identifiers and
      operational references are retained.
  - id: j
    title: Units and currencies
    text: >-
      Attributes named unit should use UCUM codes. Currencies are ISO 4217
      codes, countries ISO 3166-1 codes, languages BCP 47 tags.
  - id: k
    title: Naming
    text: >-
      Entity names in PascalCase, attribute names in camelCase, foreign keys
      named <entity>Id.
  - id: l
    title: Provenance
    text: >-
      Every entity carries originType, createdByUserId, createdByJobId and
      clientId, set by the system and not modified after creation. Where
      originType is USER, createdByUserId is set; where it is SERVICE,
      createdByJobId is set.
