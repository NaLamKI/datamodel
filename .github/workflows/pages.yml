# Publishes docs/ at https://datamodel.agrifooddata.org — after the checks,
# and only if they pass. A broken build never reaches the published
# addresses, which records and code refer to.
#
# Once, in the repository settings: Pages -> Source: GitHub Actions, custom
# domain datamodel.agrifooddata.org, Enforce HTTPS (see README.md).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits rather than cancelling a
# deployment half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # docs/ as committed — the check job has just proven it is exactly what
      # the build makes of the model.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
